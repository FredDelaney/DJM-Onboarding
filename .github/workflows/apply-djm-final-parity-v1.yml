name: Apply DJM final parity V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-djm-final-parity-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-djm-final-parity-v1
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SUPABASE_URL: https://xogoigaaskmuspiehkba.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_6hsUuNGMGMxecHXNv2xtiw_GIwRJJsU

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Apply final parity source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import json

          payloads = json.loads('{"supabase/functions/refresh-player-stats-free/index.ts": "", "supabase/migrations/20260902122251_djm_smart_reminder_schedule_v1.sql": "", "tests/connectivity-final-parity-v1.test.ts": ""}')
          for file_path, payload in payloads.items():
              target = Path(file_path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(payload, validate=True))

          target = Path('components/ConnectionsPanel.tsx')
          source = target.read_text()
          anchor = "type ReminderIntensity = 'minimal' | 'normal' | 'everything';\n\n"
          helper = (
              "type ReminderIntensity = 'minimal' | 'normal' | 'everything';\n\n"
              "const deviceTimezone = () => {\n"
              "  try {\n"
              "    return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';\n"
              "  } catch {\n"
              "    return 'UTC';\n"
              "  }\n"
              "};\n\n"
          )

          if 'const deviceTimezone = () =>' not in source:
              if anchor not in source:
                  raise SystemExit('Reminder intensity anchor not found')
              source = source.replace(anchor, helper, 1)

          source = source.replace(
              "  timezone: 'Europe/London',",
              "  timezone: deviceTimezone(),",
          )
          source = source.replace(
              "          timezone: saved.timezone || 'Europe/London',",
              "          timezone: saved.timezone || deviceTimezone(),",
          )

          if "timezone: 'Europe/London'" in source:
              raise SystemExit('London default remains')
          if "saved.timezone || 'Europe/London'" in source:
              raise SystemExit('London saved fallback remains')

          target.write_text(source)
          PY

      - name: Check patch hygiene
        run: git diff --check

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Full release gate
        run: npm run check

      - name: Commit verified parity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f ".github/workflows/apply-djm-final-parity-v1.yml"
          git add -A

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git commit -m "Align DJM production source parity"
          git push origin HEAD:main
