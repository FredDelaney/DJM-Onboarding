name: Apply DJM flexible attention and faster Tell DJM V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-djm-flexible-attention-tell-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-djm-flexible-attention-tell-v1
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SUPABASE_URL: https://xogoigaaskmuspiehkba.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_6hsUuNGMGMxecHXNv2xtiw_GIwRJJsU

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Guard exact production source
        shell: bash
        run: |
          EXPECTED="500a7804c3492a1b02a34793b2be0c83c5378bd2"
          git merge-base --is-ancestor "$EXPECTED" HEAD

          UNEXPECTED="$(git diff --name-only "$EXPECTED"..HEAD | grep -v '^\.github/workflows/apply-djm-flexible-attention-tell-v1\.yml$' || true)"
          if [ -n "$UNEXPECTED" ]; then
            echo "Source changed since expected production commit $EXPECTED:"
            echo "$UNEXPECTED"
            echo "Stopping rather than patching unexpected source."
            exit 1
          fi

      - name: Record live task completion migration
        shell: bash
        run: |
          TARGET="supabase/migrations/20260902220616_fix_player_request_completion_wrapper_v1.sql"
          test ! -e "$TARGET"
          cat > "$TARGET" <<'SQL'
          create or replace function public.djm_complete_player_request(p_request_id uuid)
          returns jsonb
          language sql
          security definer
          set search_path to ''
          as $function$
            select djm_os.complete_player_request_internal(p_request_id);
          $function$;

          revoke execute on function public.djm_complete_player_request(uuid) from public;
          revoke execute on function public.djm_complete_player_request(uuid) from anon;
          grant execute on function public.djm_complete_player_request(uuid) to authenticated;
          SQL

      - name: Record retained intelligence deletion migration
        shell: bash
        run: |
          TARGET="supabase/migrations/20260902221740_detach_retained_football_intelligence_before_player_delete_v1.sql"
          test ! -e "$TARGET"
          cat > "$TARGET" <<'SQL'
          create or replace function djm_os.detach_retained_football_intelligence_before_player_delete()
          returns trigger
          language plpgsql
          security definer
          set search_path to ''
          as $function$
          begin
            update djm_os.scouting_prospects
            set
              signed_player_id = case when signed_player_id = old.id then null else signed_player_id end,
              linked_player_id = case when linked_player_id = old.id then null else linked_player_id end,
              updated_at = now()
            where signed_player_id = old.id
               or linked_player_id = old.id;

            update djm_os.football_intelligence_subjects
            set
              player_id = null,
              representation_status = 'prospect',
              updated_at = now()
            where player_id = old.id
              and prospect_id is not null;

            return old;
          end;
          $function$;

          revoke execute on function djm_os.detach_retained_football_intelligence_before_player_delete() from public;
          revoke execute on function djm_os.detach_retained_football_intelligence_before_player_delete() from anon;
          revoke execute on function djm_os.detach_retained_football_intelligence_before_player_delete() from authenticated;

          drop trigger if exists trg_detach_retained_football_intelligence_before_player_delete on public.players;
          create trigger trg_detach_retained_football_intelligence_before_player_delete
          before delete on public.players
          for each row
          execute function djm_os.detach_retained_football_intelligence_before_player_delete();
          SQL

      - name: Record universal player deletion migration
        shell: bash
        run: |
          TARGET="supabase/migrations/20260902222300_make_player_removal_universal_v2.sql"
          test ! -e "$TARGET"
          cat > "$TARGET" <<'SQL'
          create or replace function djm_os.detach_retained_football_intelligence_before_player_delete()
          returns trigger
          language plpgsql
          security definer
          set search_path to ''
          as $function$
          declare
            v_prospect_id uuid;
            v_name text;
          begin
            v_name := coalesce(
              nullif(trim(old.preferred_name), ''),
              nullif(trim(concat_ws(' ', old.first_name, old.last_name)), ''),
              'Former DJM player'
            );

            select sp.id
            into v_prospect_id
            from djm_os.scouting_prospects sp
            where sp.signed_player_id = old.id
               or sp.linked_player_id = old.id
            order by sp.updated_at desc
            limit 1;

            if v_prospect_id is null
               and exists (
                 select 1
                 from djm_os.football_intelligence_subjects s
                 where s.player_id = old.id
                   and s.prospect_id is null
               ) then
              insert into djm_os.scouting_prospects(
                linked_player_id,
                full_name,
                date_of_birth,
                nationality,
                current_club,
                current_country,
                primary_position,
                transfermarkt_url,
                wyscout_url,
                canonical_key,
                source,
                recruitment_source,
                notes
              ) values (
                old.id,
                v_name,
                old.date_of_birth,
                nullif(array_to_string(old.nationalities, ', '), ''),
                old.current_club,
                old.current_country,
                old.primary_position,
                old.transfermarkt_url,
                old.wyscout_url,
                coalesce(
                  nullif(old.football_provider_ids->>'canonical', ''),
                  lower(regexp_replace(v_name, '[^a-zA-Z0-9]+', '-', 'g'))
                ),
                'player_removal_archive',
                'former_signed_player',
                'Retained automatically when the signed DJM player record was removed.'
              )
              returning id into v_prospect_id;
            end if;

            update djm_os.football_intelligence_subjects
            set
              prospect_id = coalesce(prospect_id, v_prospect_id),
              player_id = null,
              representation_status = 'prospect',
              updated_at = now()
            where player_id = old.id
              and (prospect_id is not null or v_prospect_id is not null);

            update djm_os.scouting_prospects
            set
              signed_player_id = case when signed_player_id = old.id then null else signed_player_id end,
              linked_player_id = case when linked_player_id = old.id then null else linked_player_id end,
              updated_at = now()
            where signed_player_id = old.id
               or linked_player_id = old.id;

            return old;
          end;
          $function$;

          revoke execute on function djm_os.detach_retained_football_intelligence_before_player_delete() from public;
          revoke execute on function djm_os.detach_retained_football_intelligence_before_player_delete() from anon;
          revoke execute on function djm_os.detach_retained_football_intelligence_before_player_delete() from authenticated;

          drop trigger if exists trg_detach_retained_football_intelligence_before_player_delete on public.players;
          create trigger trg_detach_retained_football_intelligence_before_player_delete
          before delete on public.players
          for each row
          execute function djm_os.detach_retained_football_intelligence_before_player_delete();
          SQL

      - name: Record flexible Home and notification migration
        shell: bash
        run: |
          TARGET="supabase/migrations/20260903054235_flexible_home_attention_and_notification_quality_v1.sql"
          test ! -e "$TARGET"
          cat > "$TARGET" <<'SQL'
          create table if not exists djm_os.home_item_controls (
            user_id uuid not null references auth.users(id) on delete cascade,
            item_key text not null,
            state text not null check (state in ('dismissed','snoozed')),
            snoozed_until timestamptz,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now(),
            primary key (user_id,item_key),
            constraint home_item_controls_state_time_check check (
              (state='dismissed' and snoozed_until is null)
              or (state='snoozed' and snoozed_until is not null)
            )
          );

          alter table djm_os.home_item_controls enable row level security;
          revoke all on djm_os.home_item_controls from public;
          revoke all on djm_os.home_item_controls from anon;
          revoke all on djm_os.home_item_controls from authenticated;

          create or replace function public.djm_home_item_controls()
          returns jsonb
          language sql
          stable
          security definer
          set search_path to ''
          as $function$
            select case
              when not djm_os.is_team_member() then
                (select pg_catalog.jsonb_build_array())
              else coalesce((
                select pg_catalog.jsonb_agg(
                  pg_catalog.jsonb_build_object(
                    'item_key',c.item_key,
                    'state',c.state,
                    'snoozed_until',c.snoozed_until
                  ) order by c.updated_at desc
                )
                from djm_os.home_item_controls c
                where c.user_id=auth.uid()
                  and (
                    c.state='dismissed'
                    or (c.state='snoozed' and c.snoozed_until>pg_catalog.now())
                  )
              ),'[]'::jsonb)
            end;
          $function$;

          revoke execute on function public.djm_home_item_controls() from public;
          revoke execute on function public.djm_home_item_controls() from anon;
          grant execute on function public.djm_home_item_controls() to authenticated;

          create or replace function public.djm_home_set_item_control(
            p_item_key text,
            p_action text,
            p_snoozed_until timestamptz default null
          )
          returns jsonb
          language plpgsql
          security definer
          set search_path to ''
          as $function$
          declare
            v_uid uuid:=auth.uid();
            v_key text:=trim(coalesce(p_item_key,''));
            v_action text:=lower(trim(coalesce(p_action,'')));
          begin
            if v_uid is null or not djm_os.is_team_member() then
              raise exception 'DJM team access required';
            end if;
            if length(v_key)<3 or length(v_key)>300 then
              raise exception 'Invalid Home item';
            end if;
            if v_action not in ('dismiss','snooze','restore') then
              raise exception 'Invalid Home action';
            end if;

            if v_action='restore' then
              delete from djm_os.home_item_controls
              where user_id=v_uid and item_key=v_key;
              return jsonb_build_object('item_key',v_key,'state','visible');
            end if;

            if v_action='snooze' and (p_snoozed_until is null or p_snoozed_until<=now()) then
              raise exception 'Snooze time must be in the future';
            end if;

            insert into djm_os.home_item_controls(user_id,item_key,state,snoozed_until)
            values(
              v_uid,
              v_key,
              case when v_action='dismiss' then 'dismissed' else 'snoozed' end,
              case when v_action='snooze' then p_snoozed_until else null end
            )
            on conflict(user_id,item_key) do update
            set state=excluded.state,
                snoozed_until=excluded.snoozed_until,
                updated_at=now();

            return jsonb_build_object(
              'item_key',v_key,
              'state',case when v_action='dismiss' then 'dismissed' else 'snoozed' end,
              'snoozed_until',case when v_action='snooze' then p_snoozed_until else null end
            );
          end;
          $function$;

          revoke execute on function public.djm_home_set_item_control(text,text,timestamptz) from public;
          revoke execute on function public.djm_home_set_item_control(text,text,timestamptz) from anon;
          grant execute on function public.djm_home_set_item_control(text,text,timestamptz) to authenticated;

          create or replace function private.djm_queue_delivery(
            p_user_id uuid,
            p_kind text,
            p_title text,
            p_body text,
            p_url text,
            p_payload jsonb,
            p_dedupe_key text
          )
          returns boolean
          language plpgsql
          security definer
          set search_path to 'private','public','pg_catalog'
          as $function$
          declare
            push_queued boolean:=false;
            email_queued boolean:=false;
            v_task_key text;
          begin
            if p_payload ? 'task_id' then
              v_task_key:='system:task:'||coalesce(p_payload->>'task_id','');
              if exists(
                select 1
                from djm_os.home_item_controls c
                where c.user_id=p_user_id
                  and c.item_key=v_task_key
                  and (
                    c.state='dismissed'
                    or (c.state='snoozed' and c.snoozed_until>now())
                  )
              ) then
                return false;
              end if;
            end if;

            push_queued:=private.djm_queue_push(p_user_id,p_kind,p_title,p_body,p_url,p_payload,p_dedupe_key);
            email_queued:=private.djm_queue_email(p_user_id,p_kind,p_title,p_body,p_url,p_payload,p_dedupe_key);
            return coalesce(push_queued,false) or coalesce(email_queued,false);
          end;
          $function$;

          create or replace function private.djm_queue_push(
            p_user_id uuid,
            p_kind text,
            p_title text,
            p_body text,
            p_url text,
            p_payload jsonb,
            p_dedupe_key text
          )
          returns boolean
          language plpgsql
          security definer
          set search_path to 'public','pg_catalog'
          as $function$
          declare
            prefs public.notification_preferences;
            v_entity_key text;
          begin
            if p_user_id is null then return false; end if;

            select * into prefs
            from public.notification_preferences
            where user_id=p_user_id;

            if not coalesce(prefs.push_enabled,true) then
              return false;
            end if;

            if p_kind like 'staff_task_%' and p_payload ? 'task_id' then
              v_entity_key:=p_payload->>'task_id';
              if exists(
                select 1
                from public.notification_outbox n
                where n.user_id=p_user_id
                  and n.kind like 'staff_task_%'
                  and n.payload->>'task_id'=v_entity_key
                  and n.status in ('pending','sent')
                  and n.created_at>now()-interval '8 hours'
              ) then
                return false;
              end if;
            elsif p_kind like 'player_request_%' and p_payload ? 'request_id' then
              v_entity_key:=p_payload->>'request_id';
              if exists(
                select 1
                from public.notification_outbox n
                where n.user_id=p_user_id
                  and n.kind like 'player_request_%'
                  and n.payload->>'request_id'=v_entity_key
                  and n.status in ('pending','sent')
                  and n.created_at>now()-interval '8 hours'
              ) then
                return false;
              end if;
            end if;

            insert into public.notification_outbox(
              user_id,kind,title,body,url,payload,dedupe_key
            ) values(
              p_user_id,p_kind,left(coalesce(p_title,'DJM'),120),left(coalesce(p_body,''),240),coalesce(p_url,'/home'),
              coalesce(p_payload,'{}'::jsonb),p_dedupe_key
            )
            on conflict(dedupe_key) where dedupe_key is not null do nothing;

            return found;
          end;
          $function$;

          create or replace function private.queue_admin_inbound_notification()
          returns trigger
          language plpgsql
          security definer
          set search_path to 'public','pg_catalog'
          as $function$
          declare
            player_name text;
            admin_row record;
          begin
            if new.request_type not in ('message','signal') then return new; end if;

            select coalesce(nullif(preferred_name,''),nullif(trim(concat_ws(' ',first_name,last_name)),''),'Player')
            into player_name
            from public.players
            where id=new.player_id;

            for admin_row in
              select pr.id
              from public.profiles pr
              left join public.notification_preferences np on np.user_id=pr.id
              where pr.role='admin' and coalesce(np.player_requests,true)
            loop
              perform private.djm_queue_push(
                admin_row.id,
                case when new.request_type='message' then 'player_message' else 'checkin_signal' end,
                case when new.request_type='message'
                  then 'New message from '||coalesce(player_name,'Player')
                  else coalesce(player_name,'Player')||' needs attention'
                end,
                left(case when new.request_type='message'
                  then coalesce(new.player_reply,new.title,'Open the player message in DJM.')
                  else coalesce(new.message,new.title,'Open the player update in DJM.')
                end,220),
                '/admin/players/'||new.player_id::text||'#inbox',
                jsonb_build_object('player_id',new.player_id,'request_id',new.id,'request_type',new.request_type),
                'player-inbound:'||new.id::text
              );
            end loop;

            perform net.http_post(
              url:='https://xogoigaaskmuspiehkba.supabase.co/functions/v1/dispatch-player-push',
              headers:=jsonb_build_object(
                'Content-Type','application/json',
                'x-djm-cron',(select decrypted_secret from vault.decrypted_secrets where name='djm_push_cron_secret' limit 1)
              ),
              body:=jsonb_build_object('source','inbound-player-attention','player_id',new.player_id),
              timeout_milliseconds:=10000
            );
            return new;
          end;
          $function$;

          create or replace function public.djm_tell_notify_attention(p_capture_id uuid)
          returns jsonb
          language plpgsql
          set search_path to ''
          as $function$
          declare
            v_capture djm_os.captures%rowtype;
            v_title text;
            v_body text;
            v_fingerprint text;
            v_inserted integer:=0;
            v_has_open_work boolean:=false;
          begin
            select * into v_capture
            from djm_os.captures
            where id=p_capture_id;
            if not found then raise exception 'Capture not found'; end if;

            if v_capture.status not in ('needs_input','needs_review','partial','failed','budget_blocked') then
              return jsonb_build_object('queued',false,'status',v_capture.status);
            end if;

            select exists(
              select 1 from djm_os.tell_djm_questions q
              where q.capture_id=v_capture.id and q.status not in ('answered','superseded','cancelled')
              union all
              select 1 from djm_os.tell_djm_actions a
              where a.capture_id=v_capture.id and a.status in ('needs_review','failed')
            ) into v_has_open_work;

            if v_capture.status='needs_review' and not v_has_open_work then
              return jsonb_build_object('queued',false,'status',v_capture.status,'reason','no_action_required');
            end if;

            v_title:=case v_capture.status
              when 'needs_input' then 'Tell DJM needs an answer'
              when 'needs_review' then 'Tell DJM needs a quick check'
              when 'failed' then 'Tell DJM could not finish'
              when 'partial' then 'Tell DJM saved part of this'
              else 'Tell DJM is paused'
            end;
            v_body:=left(coalesce(nullif(v_capture.summary,''),'Open Tell DJM to check this update.'),240);
            v_fingerprint:='tell:'||v_capture.id::text;

            insert into djm_os.notifications(
              user_id,notification_type,title,body,priority,
              person_id,organisation_id,player_id,payload,fingerprint,expires_at
            ) values (
              v_capture.submitted_by,
              'tell_djm_attention',
              v_title,
              v_body,
              case when v_capture.status in ('failed','partial','budget_blocked') then 92 else 82 end,
              v_capture.person_id,
              v_capture.organisation_id,
              v_capture.player_id,
              jsonb_build_object('capture_id',v_capture.id,'status',v_capture.status,'url','/tell?capture='||v_capture.id::text),
              v_fingerprint,
              now()+interval '14 days'
            )
            on conflict(fingerprint) where fingerprint is not null do nothing;
            get diagnostics v_inserted=row_count;

            if v_inserted=1 then
              perform private.djm_queue_push(
                v_capture.submitted_by,
                'tell_djm_attention',
                v_title,
                v_body,
                '/tell?capture='||v_capture.id::text,
                jsonb_build_object('capture_id',v_capture.id,'status',v_capture.status),
                'tell:'||v_capture.id::text
              );
            end if;

            return jsonb_build_object(
              'queued',v_inserted=1,
              'status',v_capture.status,
              'fingerprint',v_fingerprint
            );
          end;
          $function$;
          SQL

      - name: Align remove-player source with live V8
        shell: bash
        run: |
          cat > "supabase/functions/remove-player/index.ts" <<'TS'
          import "jsr:@supabase/functions-js/edge-runtime.d.ts";
          import { createClient } from "jsr:@supabase/supabase-js@2";

          const cors = {
            "Access-Control-Allow-Origin": "*",
            "Access-Control-Allow-Headers": "authorization, x-client-info, apikey, content-type",
            "Access-Control-Allow-Methods": "POST, OPTIONS",
            "Content-Type": "application/json",
            "Cache-Control": "no-store",
          };

          const json = (body: unknown, status = 200) =>
            new Response(JSON.stringify(body), { status, headers: cors });

          const unique = (values: string[]) => [...new Set(values.filter(Boolean))];

          async function collectFolder(admin: any, bucket: string, prefix: string, depth = 0): Promise<string[]> {
            if (!prefix || depth > 8) return [];
            const { data, error } = await admin.storage.from(bucket).list(prefix, {
              limit: 1000,
              sortBy: { column: "name", order: "asc" },
            });
            if (error) throw new Error(`Could not inspect ${bucket} storage before removal: ${error.message}`);

            const paths: string[] = [];
            for (const item of data || []) {
              const next = `${prefix}/${item.name}`;
              if (item.id) paths.push(next);
              else paths.push(...await collectFolder(admin, bucket, next, depth + 1));
            }
            return paths;
          }

          async function removePaths(admin: any, bucket: string, paths: string[]) {
            const items = unique(paths);
            let removed = 0;
            for (let index = 0; index < items.length; index += 100) {
              const batch = items.slice(index, index + 100);
              const { error } = await admin.storage.from(bucket).remove(batch);
              if (error) throw new Error(`Could not remove ${bucket} files: ${error.message}`);
              removed += batch.length;
            }
            return removed;
          }

          Deno.serve(async (req: Request) => {
            if (req.method === "OPTIONS") return new Response("ok", { headers: cors });
            if (req.method !== "POST") return json({ error: "Method not allowed" }, 405);

            try {
              const url = Deno.env.get("SUPABASE_URL");
              const serviceKey = Deno.env.get("SUPABASE_SERVICE_ROLE_KEY");
              const token = (req.headers.get("Authorization") || "").replace(/^Bearer\s+/i, "");
              if (!url || !serviceKey) return json({ error: "Service unavailable" }, 500);
              if (!token) return json({ error: "Unauthorized" }, 401);

              const admin = createClient(url, serviceKey, {
                auth: { persistSession: false, autoRefreshToken: false },
              });

              const { data: authData, error: authError } = await admin.auth.getUser(token);
              const caller = authData?.user;
              if (authError || !caller) return json({ error: "Unauthorized" }, 401);

              const { data: callerProfile, error: callerProfileError } = await admin
                .from("profiles")
                .select("role")
                .eq("id", caller.id)
                .maybeSingle();
              if (callerProfileError) throw callerProfileError;
              if (callerProfile?.role !== "admin") return json({ error: "Admin access required" }, 403);

              const body = await req.json().catch(() => ({}));
              const playerId = String(body?.player_id || "").trim();
              const confirmation = String(body?.confirmation || "").trim();
              if (!playerId) return json({ error: "Missing player" }, 400);

              const { data: player, error: playerError } = await admin
                .from("players")
                .select("id,user_id,first_name,last_name,preferred_name,profile_photo_path")
                .eq("id", playerId)
                .maybeSingle();
              if (playerError) throw playerError;
              if (!player) return json({ error: "Player not found" }, 404);

              const playerName =
                [player.first_name, player.last_name].filter(Boolean).join(" ").trim() ||
                player.preferred_name?.trim() ||
                "Unnamed player";
              if (confirmation.toLowerCase() !== playerName.toLowerCase()) {
                return json({ error: "Confirmation did not match the player name" }, 400);
              }

              let preserveLinkedAccount = false;
              if (player.user_id) {
                const [{ data: linkedProfile, error: linkedProfileError }, { data: teamMember, error: teamMemberError }] =
                  await Promise.all([
                    admin.from("profiles").select("role").eq("id", player.user_id).maybeSingle(),
                    admin.schema("djm_os").from("team_members").select("is_active").eq("user_id", player.user_id).eq("is_active", true).maybeSingle(),
                  ]);
                if (linkedProfileError) throw linkedProfileError;
                if (teamMemberError) throw teamMemberError;
                preserveLinkedAccount =
                  player.user_id === caller.id ||
                  linkedProfile?.role === "admin" ||
                  linkedProfile?.role === "scout" ||
                  Boolean(teamMember?.is_active);
              }

              const [{ data: docs, error: docsError }, { data: publicProfile, error: publicProfileError }] = await Promise.all([
                admin.from("player_documents").select("bucket_id,object_path").eq("player_id", playerId),
                admin.from("player_public_profiles").select("profile_photo_path,hero_image_path").eq("player_id", playerId).maybeSingle(),
              ]);
              if (docsError) throw docsError;
              if (publicProfileError) throw publicProfileError;

              const byBucket = new Map<string, string[]>();
              for (const doc of docs || []) {
                if (!doc?.object_path) continue;
                const bucket = doc.bucket_id || "player-private";
                byBucket.set(bucket, [...(byBucket.get(bucket) || []), doc.object_path]);
              }

              if (player.user_id && !preserveLinkedAccount) {
                const privateFolder = await collectFolder(admin, "player-private", player.user_id);
                byBucket.set("player-private", [...(byBucket.get("player-private") || []), ...privateFolder]);
              }

              const publicFolder = await collectFolder(admin, "player-public", `admin/${playerId}`);
              byBucket.set("player-public", [
                ...(byBucket.get("player-public") || []),
                ...publicFolder,
                ...(player.profile_photo_path ? [player.profile_photo_path] : []),
                ...(publicProfile?.profile_photo_path ? [publicProfile.profile_photo_path] : []),
                ...(publicProfile?.hero_image_path ? [publicProfile.hero_image_path] : []),
              ]);

              const { data: deletedRows, error: deletePlayerError } = await admin
                .from("players")
                .delete()
                .eq("id", playerId)
                .select("id");
              if (deletePlayerError) throw deletePlayerError;
              if (!deletedRows?.length) throw new Error("Player record could not be deleted");

              const { data: stillThere } = await admin.from("players").select("id").eq("id", playerId).maybeSingle();
              if (stillThere) throw new Error("Player record still exists after deletion attempt");

              const cleanupWarnings: string[] = [];
              let authDeleted = false;
              if (player.user_id && !preserveLinkedAccount) {
                const { error: deleteAuthError } = await admin.auth.admin.deleteUser(player.user_id);
                if (deleteAuthError) cleanupWarnings.push(`Linked player login cleanup failed: ${deleteAuthError.message}`);
                else authDeleted = true;
              }

              let storageRemoved = 0;
              for (const [bucket, paths] of byBucket.entries()) {
                try {
                  storageRemoved += await removePaths(admin, bucket, paths);
                } catch (error) {
                  cleanupWarnings.push(error instanceof Error ? error.message : `Could not clean ${bucket} storage`);
                }
              }

              return json({
                ok: true,
                player_id: playerId,
                player_name: playerName,
                auth_deleted: authDeleted,
                linked_account_preserved: preserveLinkedAccount,
                storage_objects_removed: storageRemoved,
                cleanup_complete: cleanupWarnings.length === 0,
                cleanup_warnings: cleanupWarnings,
                retained_operational_history: true,
              });
            } catch (error) {
              return json({ error: error instanceof Error ? error.message : "Could not remove player" }, 500);
            }
          });
          TS

      - name: Align push dispatcher source with live V7
        shell: bash
        run: |
          cat > "supabase/functions/dispatch-player-push/index.ts" <<'TS'
          import "jsr:@supabase/functions-js/edge-runtime.d.ts";
          import { createClient } from "npm:@supabase/supabase-js@2";
          import webpush from "npm:web-push@3.6.7";

          const cors = {
            "Access-Control-Allow-Origin": "*",
            "Access-Control-Allow-Headers": "authorization, x-client-info, apikey, content-type, x-djm-cron",
            "Access-Control-Allow-Methods": "POST, OPTIONS",
            "Content-Type": "application/json",
            "Cache-Control": "no-store",
          };

          function pushTag(item: any) {
            const payload = item?.payload && typeof item.payload === "object" ? item.payload : {};
            if (payload.task_id) return `djm-task-${payload.task_id}`;
            if (payload.request_id) return `djm-request-${payload.request_id}`;
            if (payload.capture_id) return `djm-tell-${payload.capture_id}`;
            if (payload.player_id) return `djm-player-${payload.player_id}-${item.kind || "attention"}`;
            return `djm-${item.kind || item.id}`;
          }

          function pushUrgency(kind: string) {
            return ["player_message", "checkin_signal", "tell_djm_attention"].includes(kind) ? "high" : "normal";
          }

          Deno.serve(async (req: Request) => {
            if (req.method === "OPTIONS") return new Response("ok", { headers: cors });
            if (req.method !== "POST") return new Response(JSON.stringify({ error: "Method not allowed" }), { status: 405, headers: cors });

            const url = Deno.env.get("SUPABASE_URL");
            const service = Deno.env.get("SUPABASE_SERVICE_ROLE_KEY");
            if (!url || !service) return new Response(JSON.stringify({ error: "Service unavailable" }), { status: 500, headers: cors });
            const db = createClient(url, service, { auth: { persistSession: false } });

            let authorised = false;
            const cronSecret = req.headers.get("x-djm-cron");
            if (cronSecret) {
              const { data: expected, error } = await db.rpc("get_push_scheduler_secret");
              if (!error && typeof expected === "string" && expected.length > 20 && cronSecret === expected) authorised = true;
            }
            if (!authorised) {
              const auth = req.headers.get("Authorization") || "";
              const token = auth.replace(/^Bearer\s+/i, "");
              if (token) {
                const { data: { user }, error: userError } = await db.auth.getUser(token);
                if (!userError && user) {
                  const { data: profile } = await db.from("profiles").select("role").eq("id", user.id).maybeSingle();
                  if (profile?.role === "admin") authorised = true;
                }
              }
            }
            if (!authorised) return new Response(JSON.stringify({ error: "Unauthorized" }), { status: 401, headers: cors });

            const { data: config, error: configError } = await db.rpc("get_web_push_config");
            const cfg = Array.isArray(config) ? config[0] : config;
            if (configError || !cfg?.public_key || !cfg?.private_key) {
              return new Response(JSON.stringify({ error: "Push configuration missing" }), { status: 500, headers: cors });
            }
            webpush.setVapidDetails(cfg.subject, cfg.public_key, cfg.private_key);

            const { data: items, error: itemsError } = await db.from("notification_outbox").select("*").eq("status", "pending").order("created_at", { ascending: true }).limit(50);
            if (itemsError) return new Response(JSON.stringify({ error: "Could not read outbox" }), { status: 500, headers: cors });

            let sent = 0, failed = 0, cancelled = 0;
            for (const item of items || []) {
              const { data: subs } = await db.from("push_subscriptions").select("id,endpoint,p256dh,auth_secret").eq("user_id", item.user_id).eq("enabled", true);
              if (!subs?.length) {
                await db.from("notification_outbox").update({ status: "cancelled", attempts: (item.attempts || 0) + 1, last_error: "No active push subscription" }).eq("id", item.id);
                cancelled += 1;
                continue;
              }

              let delivered = 0;
              const errors: string[] = [];
              const tag = pushTag(item);
              for (const sub of subs) {
                try {
                  await webpush.sendNotification(
                    { endpoint: sub.endpoint, keys: { p256dh: sub.p256dh, auth: sub.auth_secret } },
                    JSON.stringify({ title: item.title, body: item.body, url: item.url, tag, kind: item.kind, payload: item.payload || {} }),
                    { TTL: item.kind === "player_message" ? 21600 : 3600, urgency: pushUrgency(item.kind || "") },
                  );
                  delivered += 1;
                } catch (error: any) {
                  const code = error?.statusCode || error?.status;
                  errors.push(`${code || "error"}: ${error?.message || "push failed"}`);
                  if (code === 404 || code === 410) {
                    await db.from("push_subscriptions").update({ enabled: false, updated_at: new Date().toISOString() }).eq("id", sub.id);
                  }
                }
              }

              if (delivered > 0) {
                await db.from("notification_outbox").update({ status: "sent", attempts: (item.attempts || 0) + 1, last_error: errors.length ? errors.join(" | ") : null, sent_at: new Date().toISOString() }).eq("id", item.id);
                sent += 1;
              } else {
                await db.from("notification_outbox").update({ status: "failed", attempts: (item.attempts || 0) + 1, last_error: errors.join(" | ") || "Delivery failed" }).eq("id", item.id);
                failed += 1;
              }
            }

            return new Response(JSON.stringify({ processed: (items || []).length, sent, failed, cancelled }), { status: 200, headers: cors });
          });
          TS

