name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check

  browser_journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Configure bounded browser dependency downloads
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99-browser-ci >/dev/null
      - run: npx playwright install --with-deps chromium
      - run: npm run check:browser
        env:
          PLATFORM_POLISH_SCREENSHOTS: '1'
          PLATFORM_POLISH_SCREENSHOT_DIR: /tmp/platform-polish-screenshots
          PLATFORM_POLISH_REPORT: /tmp/platform-polish-report.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: platform-polish-review
          path: |
            /tmp/platform-polish-screenshots
            /tmp/platform-polish-report.json
            /tmp/redream-platform-programme/roster
          retention-days: 7
          if-no-files-found: ignore
