name: Apply DJM final hardening V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-djm-final-hardening-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-djm-final-hardening-v1
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SUPABASE_URL: https://xogoigaaskmuspiehkba.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_6hsUuNGMGMxecHXNv2xtiw_GIwRJJsU

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Recover guarded hardening patch
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          Path('/tmp/apply-djm-final-hardening-v1.cjs').write_bytes(
              base64.b64decode('', validate=True)
          )
          PY
          node --check /tmp/apply-djm-final-hardening-v1.cjs

      - name: Apply source changes
        run: node /tmp/apply-djm-final-hardening-v1.cjs

      - name: Check patch hygiene
        run: git diff --check

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Full release gate
        run: npm run check

      - name: Commit verified final hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "lib/football-season-stats.ts" \
            "lib/dossier.ts" \
            "components/PlayerStatsPanel.tsx" \
            "components/PublicProfile.tsx" \
            "components/ClubCvPdf.tsx" \
            "tests/dossier-season-totals-v1.test.ts" \
            "supabase/config.toml" \
            "supabase/functions/djm-calendar-feed/index.ts" \
            "supabase/functions/dispatch-djm-email/index.ts" \
            "supabase/migrations/20260902112123_djm_connectivity_preference_compatibility_v1.sql" \
            "supabase/migrations/20260902112254_djm_smart_reminder_multichannel_delivery_v1.sql" \
            "supabase/migrations/20260902113027_djm_dossier_season_totals_v1.sql"

          git rm -f ".github/workflows/apply-djm-final-hardening-v1.yml"

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git commit -m "Harden connectivity and dossier season totals"
          git push origin HEAD:main
