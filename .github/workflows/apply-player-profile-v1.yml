name: Apply Player Profile v1

on:
  push:
    branches:
      - player-profile-v1
    paths:
      - tools/apply-player-profile-v1.mjs
      - .github/workflows/apply-player-profile-v1.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: player-profile-v1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply Player Profile build
        run: node tools/apply-player-profile-v1.mjs

      - name: Verify build
        run: npm run check

      - name: Commit verified build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            components/AgencyPlayerProfile.tsx \
            components/AgencyPlayerProfile.module.css \
            components/AgencyOperatingWorkspace.tsx \
            components/PublicProfile.tsx \
            components/ClubCvPdf.tsx \
            app/cv/page.tsx \
            app/p/[slug]/page.tsx \
            app/admin/players/[id]/page.tsx \
            supabase/functions/agency-os/index.ts \
            supabase/functions/club-share-public/index.ts \
            supabase/migrations/20260925144357_player_profile_tenant_sharing_v1.sql \
            supabase/migrations/20260925144747_player_profile_branding_bridge_v1.sql \
            tests/player-profile-v1.test.ts
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Build tenant-native Player Profile"
          git push
