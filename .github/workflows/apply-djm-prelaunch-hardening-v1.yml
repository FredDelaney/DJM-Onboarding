name: Apply DJM prelaunch hardening V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-djm-prelaunch-hardening-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-djm-prelaunch-hardening-v1
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SUPABASE_URL: https://xogoigaaskmuspiehkba.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_6hsUuNGMGMxecHXNv2xtiw_GIwRJJsU

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Guard exact audited production base
        shell: bash
        run: |
          EXPECTED="d5e62103e51cb8a626a3eb5b3885c4b62b9ac1a7"
          PARENT="$(git rev-parse HEAD^)"
          if [ "$PARENT" != "$EXPECTED" ]; then
            echo "Expected audited parent $EXPECTED but found $PARENT"
            echo "Stopping rather than applying pre-launch hardening to an unexpected source state."
            exit 1
          fi

      - name: Apply pre-launch hardening
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          payload = ""
          Path('/tmp/djm-prelaunch-hardening-v1.py').write_bytes(
              base64.b64decode(payload, validate=True)
          )
          PY
          python -m py_compile /tmp/djm-prelaunch-hardening-v1.py
          python /tmp/djm-prelaunch-hardening-v1.py

      - name: Check patch hygiene
        run: git diff --check

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Full release gate
        run: npm run check

      - name: Commit verified pre-launch hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f ".github/workflows/apply-djm-prelaunch-hardening-v1.yml"
          git add             "app/privacy/page.tsx"             "app/privacy/privacy.module.css"             "app/join/[token]/page.tsx"             "components/RemovePlayerSheet.tsx"             "supabase/functions/accept-player-invite/index.ts"             "supabase/functions/club-document/index.ts"             "supabase/functions/remove-player/index.ts"             "tests/prelaunch-hardening-v1.test.ts"

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git commit -m "Harden DJM Player prelaunch privacy and deletion"
          git push origin HEAD:main
