name: Repair DJM final hardening V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-djm-final-hardening-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-djm-final-hardening-v2
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SUPABASE_URL: https://xogoigaaskmuspiehkba.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_6hsUuNGMGMxecHXNv2xtiw_GIwRJJsU

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Recover original guarded patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re

          text = Path('.github/workflows/apply-djm-final-hardening-v1.yml').read_text()
          match = re.search(r"base64\.b64decode\('([A-Za-z0-9+/=]+)', validate=True\)", text)
          if not match:
              raise SystemExit('Could not recover the original hardening payload')
          Path('/tmp/apply-djm-final-hardening-v1.cjs').write_bytes(
              base64.b64decode(match.group(1), validate=True)
          )
          PY
          node --check /tmp/apply-djm-final-hardening-v1.cjs

      - name: Apply original hardening source changes
        run: node /tmp/apply-djm-final-hardening-v1.cjs

      - name: Apply final contract repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Keep dossier.ts directly importable by Node tests.
          dossier_path = Path('lib/dossier.ts')
          dossier = dossier_path.read_text()

          import_block = """import {
            aggregateFootballStats,
            headlineSeasonRows,
            resolveHeadlineSeason,
          } from '@/lib/football-season-stats';

          """.replace('          ', '')

          if import_block in dossier:
              dossier = dossier.replace(import_block, '', 1)

          start = dossier.index('export const dossierHeadlineStats = (')
          end = dossier.index('export const dossierPerformance = (')

          replacement = r"""export const dossierHeadlineStats = (
            profile: any,
            limit = 6,
          ) => {
            const key = (value: unknown) =>
              String(value || '')
                .toLowerCase()
                .replace(/\s+/g, '');

            const manual =
              dossierList(profile?.key_stats)
                .map((item: any) => ({
                  label: String(item?.label ?? item?.name ?? '').trim(),
                  value: String(item?.value ?? item?.stat ?? '').trim(),
                }))
                .filter((item) => item.label && item.value);

            const output = [...manual];
            const seen = new Set(output.map((item) => key(item.label)));
            const career = dossierCareer(profile);
            const selected = career[0] || null;
            const selectedYear = numeric(selected?.stats_year);
            const selectedLabel = String(
              selected?.season_label ?? selected?.season ?? '',
            )
              .trim()
              .toLowerCase()
              .replaceAll('/', '-')
              .replace(/\s+/g, '');

            const periodRows = selected
              ? career.filter((row: any) => {
                  const rowYear = numeric(row?.stats_year);
                  const rowLabel = String(
                    row?.season_label ?? row?.season ?? '',
                  )
                    .trim()
                    .toLowerCase()
                    .replaceAll('/', '-')
                    .replace(/\s+/g, '');

                  if (selectedYear !== null && rowYear !== null) {
                    return rowYear === selectedYear;
                  }

                  return rowLabel && rowLabel === selectedLabel;
                })
              : [];

            const sum = (
              field:
                | 'appearances'
                | 'starts'
                | 'minutes'
                | 'goals'
                | 'assists',
            ) => {
              const known = periodRows
                .map((row: any) => numeric(row?.[field]))
                .filter((value): value is number => value !== null);

              return known.length
                ? known.reduce((total, value) => total + value, 0)
                : null;
            };

            const apps = sum('appearances');
            const starts = sum('starts');
            const minutes = sum('minutes');
            const goals = sum('goals');
            const assists = sum('assists');
            const contributions =
              goals !== null || assists !== null
                ? (goals || 0) + (assists || 0)
                : null;

            const candidates: Record<string, number | string | null> = {
              Apps: apps,
              Starts: starts,
              Minutes:
                minutes !== null
                  ? minutes.toLocaleString('en-GB')
                  : null,
              Goals: goals,
              Assists: assists,
              'G+A': contributions,
            };

            ['Apps', 'Starts', 'Minutes', 'Goals', 'Assists', 'G+A'].forEach(
              (label) => {
                if (output.length >= limit) return;

                const value = candidates[label];
                if (
                  value === null ||
                  value === undefined ||
                  seen.has(key(label))
                ) {
                  return;
                }

                output.push({ label, value: String(value) });
                seen.add(key(label));
              },
            );

            return output.slice(0, limit);
          };

          """
          replacement = replacement.replace('          ', '')
          dossier = dossier[:start] + replacement + dossier[end:]
          dossier_path.write_text(dossier)

          # Register the two new Edge Functions in the explicit contract list.
          edge_test_path = Path('tests/edge-function-contract.test.ts')
          edge_test = edge_test_path.read_text()

          if "'dispatch-djm-email'," not in edge_test:
              edge_test = edge_test.replace(
                  "    'club-document',\n    'dispatch-player-push',",
                  "    'club-document',\n    'dispatch-djm-email',\n    'dispatch-player-push',",
                  1,
              )

          if "'djm-calendar-feed'," not in edge_test:
              edge_test = edge_test.replace(
                  "    'djm-build-src-00',\n    'djm-network-capture',",
                  "    'djm-build-src-00',\n    'djm-calendar-feed',\n    'djm-network-capture',",
                  1,
              )

          edge_test_path.write_text(edge_test)

          # Fix the original patch's escaped-newline TOML serialization.
          config_path = Path('supabase/config.toml')
          config = config_path.read_text()

          escaped = (
              r"\n[functions.djm-calendar-feed]\nverify_jwt = false\n"
              r"\n[functions.dispatch-djm-email]\nverify_jwt = false\n"
          )
          config = config.replace(escaped, '')

          # Remove any partially escaped individual variants too.
          config = config.replace(
              r"\n[functions.djm-calendar-feed]\nverify_jwt = false\n",
              '',
          )
          config = config.replace(
              r"\n[functions.dispatch-djm-email]\nverify_jwt = false\n",
              '',
          )

          config = config.rstrip() + (
              "\n\n[functions.djm-calendar-feed]\n"
              "verify_jwt = false\n"
              "\n[functions.dispatch-djm-email]\n"
              "verify_jwt = false\n"
          )
          config_path.write_text(config)
          PY

      - name: Check patch hygiene
        run: git diff --check

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Full release gate
        run: npm run check

      - name: Commit verified final hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f \
            ".github/workflows/apply-djm-final-hardening-v1.yml" \
            ".github/workflows/repair-djm-final-hardening-v1.yml" \
            ".github/workflows/repair-djm-final-hardening-v2.yml"

          git add -A

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git commit -m "Harden connectivity and dossier season totals"
          git push origin HEAD:main
