name: Apply DJM connectivity release V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-connectivity-release-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-djm-connectivity-release-v1
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SUPABASE_URL: https://xogoigaaskmuspiehkba.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_6hsUuNGMGMxecHXNv2xtiw_GIwRJJsU

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Decode guarded connectivity patch
        shell: bash
        run: |
          cat > /tmp/connectivity-release-v1.b64 <<'PATCH_PAYLOAD'

PATCH_PAYLOAD
          base64 --decode /tmp/connectivity-release-v1.b64 > /tmp/apply-connectivity-release-v1.mjs
          node --check /tmp/apply-connectivity-release-v1.mjs

      - name: Apply exact source changes
        run: node /tmp/apply-connectivity-release-v1.mjs

      - name: Check patch hygiene
        run: git diff --check

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Full release gate
        run: npm run check

      - name: Commit verified connectivity release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             "app/sign-in/page.tsx"             "app/forgot-password/page.tsx"             "app/reset-password/page.tsx"             "app/connections/page.tsx"             "app/(djm-os)/settings/page.tsx"             "app/(djm-os)/settings/connections/page.tsx"             "components/AppExperience.tsx"             "components/ConnectionsPanel.tsx"             "components/ConnectionsPanel.module.css"             "components/PlayerShell.tsx"             "lib/auth-capabilities.ts"             "lib/push.ts"             "lib/supabase.ts"             "tests/connectivity-release-v1.test.ts"             "supabase/migrations/20260901210811_fix_recruitment_promotion_security_boundary_v1.sql"             "supabase/migrations/20260902090000_djm_connectivity_source_alignment_v1.sql"

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git commit -m "Implement DJM connectivity release V1"
          git push origin HEAD:main
