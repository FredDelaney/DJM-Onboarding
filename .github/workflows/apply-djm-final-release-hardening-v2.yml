name: Apply DJM final release hardening V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-djm-final-release-hardening-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-djm-final-release-hardening-v2
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SUPABASE_URL: https://xogoigaaskmuspiehkba.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_6hsUuNGMGMxecHXNv2xtiw_GIwRJJsU

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Guard exact audited production source
        shell: bash
        run: |
          EXPECTED="9c7f382f274bb0ef53531a850a502a969bbded79"
          git merge-base --is-ancestor "$EXPECTED" HEAD

          UNEXPECTED="$(git diff --name-only "$EXPECTED"..HEAD | grep -Ev '^\.github/workflows/apply-djm-final-release-hardening-v[12]\.yml$' || true)"
          if [ -n "$UNEXPECTED" ]; then
            echo "Source changed since audited commit $EXPECTED:"
            echo "$UNEXPECTED"
            echo "Stopping rather than patching an unexpected source state."
            exit 1
          fi

      - name: Apply final release hardening V2
        shell: bash
        run: |
          echo "" | base64 --decode > /tmp/djm-final-release-hardening-v2.py
          python -m py_compile /tmp/djm-final-release-hardening-v2.py
          python /tmp/djm-final-release-hardening-v2.py

      - name: Check patch hygiene
        shell: bash
        run: |
          git diff --check

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Full release gate
        run: npm run check

      - name: Inspect hosted passkey readiness
        shell: bash
        run: |
          SETTINGS="$(curl -fsS "$NEXT_PUBLIC_SUPABASE_URL/auth/v1/settings" -H "apikey: $NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY")"
          AUTH_SETTINGS="$SETTINGS" python - <<'PY'
          import json
          import os

          data = json.loads(os.environ["AUTH_SETTINGS"])
          enabled = bool(
              data.get("passkey_enabled") is True
              or data.get("passkeys_enabled") is True
              or (isinstance(data.get("webauthn"), dict) and data["webauthn"].get("enabled") is True)
          )
          print(f"Hosted passkey enabled: {str(enabled).lower()}")
          print("Expected production RP ID: djmsports.com")
          print("Expected production origin: https://app.djmsports.com")
          PY

      - name: Commit verified final release hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f ".github/workflows/apply-djm-final-release-hardening-v1.yml" ".github/workflows/apply-djm-final-release-hardening-v2.yml"
          git add \
            "app/join/[token]/page.tsx" \
            "app/sign-in/page.tsx" \
            "components/ConnectionsPanel.tsx" \
            "lib/auth-capabilities.ts" \
            "supabase/config.toml" \
            "supabase/functions/accept-player-invite/index.ts" \
            "supabase/functions/club-document/index.ts" \
            "supabase/functions/dispatch-djm-email/index.ts" \
            "supabase/functions/remove-player/index.ts" \
            "supabase/migrations/20260902205150_hide_sensitive_club_share_document_metadata_v1.sql" \
            "tests/connectivity-release-v1.test.ts" \
            "tests/final-release-hardening-v2.test.ts"

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git commit -m "Finalise DJM release security and passkeys"
          git push origin HEAD:main
