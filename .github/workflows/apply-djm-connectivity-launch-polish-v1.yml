name: Apply DJM connectivity launch polish V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-djm-connectivity-launch-polish-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-djm-connectivity-launch-polish-v1
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SUPABASE_URL: https://xogoigaaskmuspiehkba.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_6hsUuNGMGMxecHXNv2xtiw_GIwRJJsU

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Guard exact verified base
        shell: bash
        run: |
          EXPECTED="b3d44276d4b98cdb70886a883a9dfb9a8bfa394c"
          PARENT="$(git rev-parse HEAD^)"
          if [ "$PARENT" != "$EXPECTED" ]; then
            echo "Expected parent $EXPECTED but found $PARENT"
            echo "Stopping rather than applying polish onto an unexpected source state."
            exit 1
          fi

      - name: Apply launch polish
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          payload = ""
          Path('/tmp/djm-connectivity-launch-polish-v1.py').write_bytes(
              base64.b64decode(payload, validate=True)
          )
          PY
          python -m py_compile /tmp/djm-connectivity-launch-polish-v1.py
          python /tmp/djm-connectivity-launch-polish-v1.py

      - name: Check patch hygiene
        run: git diff --check

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Full release gate
        run: npm run check

      - name: Commit verified launch polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f ".github/workflows/apply-djm-connectivity-launch-polish-v1.yml"
          git add "components/ConnectionsPanel.tsx" "tests/connectivity-launch-polish-v1.test.ts"

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git commit -m "Polish DJM connectivity launch experience"
          git push origin HEAD:main
