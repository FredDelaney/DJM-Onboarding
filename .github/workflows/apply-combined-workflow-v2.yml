name: Apply combined workflow V2

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-combined-workflow-v2.mjs'
      - '.github/workflows/apply-combined-workflow-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-combined-workflow-v2
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Apply exact source patches
        run: node tools/apply-combined-workflow-v2.mjs

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Full release gate
        run: npm run check

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             "lib/admin-command-centre.ts"             "app/(djm-os)/djm/page.tsx"             "app/admin/players/[id]/page.tsx"             "app/(djm-os)/opportunities/page.tsx"             "components/TellDjmCapture.tsx"
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Implement combined workflow V2"
          git push origin HEAD:main
